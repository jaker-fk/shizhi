name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check api.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python
        run: python -m py_compile backend/app.py backend/db.py backend/models.py backend/schemas.py backend/security.py

      - name: Validate Docker Compose
        run: docker compose config --quiet
