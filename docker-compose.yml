name: shizhi

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: shizhi-web:local
    container_name: shizhi-web
    ports:
      # 只绑定本机回环地址，避免把私人知识库暴露到局域网。
      - "127.0.0.1:8765:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: shizhi-api:local
    container_name: shizhi-api
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-shizhi}
      DB_USER: ${MYSQL_USER:-shizhi}
      DB_PASSWORD: ${MYSQL_PASSWORD:-shizhi_dev_password}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  mysql:
    image: mysql:8.4
    container_name: shizhi-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shizhi}
      MYSQL_USER: ${MYSQL_USER:-shizhi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shizhi_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shizhi_root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
    name: shizhi_mysql_data
